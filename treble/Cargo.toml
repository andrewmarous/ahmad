[package]
name = "ahmad"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
iced = { version = "0.13.1", features = ["tokio"] }
iced_futures = "0.13.2"
magic = "0.16.2"
anyhow = "1.0.98"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
dotenv = "0.15.0"
tokio = { version = "1.46.1", default-features = true, features = ["io-util", "full"] }
reqwest = { version = "0.12.22", default-features = true, features = ["json", "stream", "blocking"] }
url = "2.5.4"
serde = { version = "1.0.219", default-features = true, features = ["derive"] }
rfd = "0.15.4"
serde_json = "1.0.141"
bytes = "1.10.1"
dirs = "6.0.0"
cargo-bundle = "0.8.0"
base64 = "0.22.1"

[package.metadata.bundle]
name = "muse"
identifier = "com.Andrew Marous.muse"
icon = ["appbuild/icon.icns"]
osx_url_schemes = ["com.Andrew Marous.muse"]
